<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | GameHub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img src="/logo-transparent.png" alt="GameHub">
    </a>

    <nav>
      <a href="/">Inicio</a>
      <a href="/novedades.html">Novedades</a>
      <a href="/ofertas.html">Ofertas</a>
      <a href="/proximamente.html">Próximamente</a>
      <a href="/todos.html">Todos los juegos</a>
    </nav>

    <div class="actions">
      <button id="wishlistBtn" class="secondary-button">Wishlist</button>
      <button id="profileBtn" class="secondary-button">Perfil</button>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>

  <main class="admin-page">
    <section class="admin-header">
      <div>
        <p class="eyebrow">ADMINISTRACIÓN</p>
        <h1>Gestión de videojuegos</h1>
        <p>Busca un videojuego en RAWG y registra su información en el catálogo de GameHub.</p>
      </div>
    </section>

    <section class="admin-layout">
      <div class="admin-panel">
        <div class="panel-header">
          <h2>Buscar en RAWG</h2>
          <span id="rawgStatus"></span>
        </div>

        <div class="admin-search">
          <input
            type="search"
            id="rawgSearch"
            placeholder="Ej. The Witcher 3, Elden Ring..."
          >
          <button id="searchRawgBtn" class="primary-button">Buscar</button>
        </div>

        <div id="rawgResults" class="rawg-results"></div>
      </div>


      <div class="admin-panel admin-users-panel">
        <div class="panel-header">
          <h2>Usuarios</h2>
          <span id="usersStatus"></span>
        </div>

        <div id="usersList" class="users-list"></div>
      </div>

      <div class="admin-panel admin-game-panel">
        <div class="panel-header">
          <h2>Nuevo videojuego</h2>
          <button id="clearFormBtn" class="secondary-button">Limpiar</button>
        </div>

        <form id="gameForm" class="admin-form">
          <input type="hidden" id="rawgId">

          <label for="gameTitle">Título</label>
          <input id="gameTitle" type="text" required>

          <label for="gameDescription">Descripción</label>
          <textarea id="gameDescription" rows="7"></textarea>

          <div class="form-grid">
            <div>
              <label for="gameRelease">Fecha de lanzamiento</label>
              <input id="gameRelease" type="date">
            </div>

            <div>
              <label for="gameGenre">Género</label>
              <input id="gameGenre" type="text">
            </div>
          </div>

          <label for="gamePlatform">Plataforma</label>
          <input id="gamePlatform" type="text" value="PC">

          <label for="gameImage">Imagen</label>
          <input id="gameImage" type="url" placeholder="URL de la imagen">

          <label for="gameCustomImage">Imagen personalizada</label>
          <input id="gameCustomImage" type="url" placeholder="Opcional">

          <div class="form-grid">
            <div>
              <label for="gameRating">Calificación</label>
              <input id="gameRating" type="number" min="0" max="5" step="0.1" value="0">
            </div>

            <div>
              <label for="gameCategory">Categoría</label>
              <select id="gameCategory">
                <option value="">Sin categoría</option>
                <option value="1">RPG</option>
                <option value="2">Acción</option>
                <option value="3">Aventura</option>
                <option value="4">Terror</option>
                <option value="5">Estrategia</option>
                <option value="6">Indie</option>
              </select>
            </div>
          </div>

          <label class="check-row">
            <input id="gameSale" type="checkbox">
            Marcar como oferta
          </label>

          <div class="form-grid">
            <div>
              <label for="originalPrice">Precio original</label>
              <input id="originalPrice" type="number" min="0" step="0.01">
            </div>

            <div>
              <label for="salePrice">Precio de oferta</label>
              <input id="salePrice" type="number" min="0" step="0.01">
            </div>
          </div>

          <button type="submit" class="primary-button">
            Registrar videojuego
          </button>

          <p id="adminMessage" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
